controller_manager:
  ros__parameters:

    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    pan_tilt_controller:
      type: joint_trajectory_controller/JointTrajectoryController

pan_tilt_controller:
  ros__parameters:

    joints:
      - pan_joint
      - tilt_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0

    allow_partial_joints_goal: false
